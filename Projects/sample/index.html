    <!-- Google Analytics (gtag.js, GA4 G-767CWP2X0J) + Google Tag Manager — deferred.
         Both scripts (~300 KB) load after the page has rendered: on the first
         scroll/tap/key, or 4s after window load, whichever comes first.
         Commands pushed to dataLayer before that are queued, not lost.
         (GA4 page views come from gtag.js, not from the GTM container.) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-767CWP2X0J');
      dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

      (function () {
        var loaded = false;
        var events = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
        function add(src) {
          var s = document.createElement('script');
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        }
        function load() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { window.removeEventListener(e, load); });
          add('https://www.googletagmanager.com/gtag/js?id=G-767CWP2X0J');
          add('https://www.googletagmanager.com/gtm.js?id=GTM-NNF6VTK4');
        }
        events.forEach(function (e) { window.addEventListener(e, load, { once: true, passive: true }); });
        window.addEventListener('load', function () { setTimeout(load, 4000); });
      })();
    </script>
